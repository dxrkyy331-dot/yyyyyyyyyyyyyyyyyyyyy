name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: gradlew executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: rockstar-client-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: release (tylko tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          gh release create "${{ github.ref_name }}" "$JAR" --title "${{ github.ref_name }}" --generate-notes
